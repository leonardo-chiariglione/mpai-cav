<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M-Instance viewer (arms 5)</title>
<!--
  THE M-ENVIRONMENT OF AN M-INSTANCE, AS IT CAN BE SEEN (MMM-TEC V2.2). The page reads
  the M-Instance's snapshot (./state) twice a second and draws it: its M-Locations as
  pads on the ground, a Location placed at another (a Room on its Parcel) as a room
  there, shown only once perceptible; each Persona, with its 3D Model, where MM-Add
  and MM-Move put it, walking there when it moves. The Process Actions just performed
  are listed in the corner.
-->
<style>
  :root { --bg: #1d2128; --panel: rgba(20,24,30,.82); --text: #e6e8eb; --muted: #9aa3ad; --ok: #6fcf97; --no: #eb5757; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, Arial, sans-serif; overflow: hidden; }
  #panel { position: absolute; top: 12px; left: 12px; max-width: min(420px, calc(100vw - 24px)); background: var(--panel); border-radius: 8px; padding: 10px 12px; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #recent div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ok { color: var(--ok); } .no { color: var(--no); } .muted { color: var(--muted); }
  #caption { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); max-width: calc(100vw - 48px); background: var(--panel); border-radius: 10px; padding: 12px 22px; text-align: center; font-size: 22px; font-weight: 600; cursor: pointer; user-select: none; }
  #caption small { display: block; margin-top: 4px; font-size: 13px; font-weight: 400; color: var(--muted); }
  #caption[hidden] { display: none; }
  #captionNote { margin-top: 6px; font-size: 15px; font-weight: 400; color: #f2c94c; max-width: 760px; }
  #captionNote:empty { display: none; }
  /* THE BAR of the buttons of the meeting, bottom left: end, share, room window, mic, hand, summary. */
  /* THE BAR: one line at the foot of the page, so that the room has almost the whole window. */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; flex-wrap: nowrap; justify-content: center; align-items: center; gap: 8px; padding: 3px 12px; background: color-mix(in srgb, var(--panel) 80%, transparent); overflow-x: auto; }
  #bar:empty { display: none; }
  #bar button, #bar select { background: var(--panel); color: inherit; border: 1px solid #5a8; border-radius: 8px; padding: 0 14px; font-size: 14px; line-height: 1.15; cursor: pointer; }
  #handsList { position: fixed; right: 10px; top: 54px; z-index: 19; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #handsList span { background: var(--panel); border-radius: 8px; padding: 4px 12px; font-size: 14px; }
  #summary { position: fixed; right: 10px; top: 54px; z-index: 18; width: min(430px, calc(100vw - 20px)); max-height: 62vh; overflow: auto; background: var(--panel); border-radius: 10px; padding: 12px 14px; }
  #summary[hidden] { display: none; }
  #summary h2 { font-size: 14px; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #summary h2 button { background: transparent; color: inherit; border: 1px solid #5a8; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  #summaryText { white-space: pre-wrap; font-size: 14px; line-height: 1.45; }
  #notice { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: var(--panel); border-radius: 8px; padding: 8px 18px; font-size: 16px; max-width: calc(100vw - 40px); text-align: center; z-index: 15; }
  #notice:empty { display: none; }
  .label { color: #fff; font: 12px system-ui, Arial; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/three/three.module.js",
  "three/addons/": "./lib/three/addons/"
}}
</script>
</head>
<body>
<div id="panel"><h1 id="title">M-Instance</h1><div id="recent" class="muted">waiting for the M-Instance...</div></div>
<div id="notice"></div>
<div id="bar"><button id="ghostBtn" style="order:7" title="G">Leave my body</button></div><div id="handsList"></div>
<div id="summary" hidden><h2><span id="summaryTitle">Summary</span><span><button id="summaryClose" title="Close this panel">&times;</button><button id="summaryUpdate" title="A new summary, from everything said until now">Update</button></span></h2><div id="summaryText"></div></div>
<div id="screenView"><img id="screenImg" alt="shared screen"></div>
<div id="caption" hidden><span id="captionText"></span><div id="captionNote"></div><small id="captionHint"></small></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';

// ---------------------------------------------------------------- the stage
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.domElement.id = 'stage';
document.body.appendChild(renderer.domElement);
const labels = new CSS2DRenderer(); labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: 'absolute', top: '0', pointerEvents: 'none' });
labels.domElement.id = 'labels';
document.body.appendChild(labels.domElement);

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a3038);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const hemi = new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(8, 14, 10); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 }); sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x3b4450, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// The camera frames the M-Environment (about 30 m across) whatever the window's shape.
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
function frame() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const halfWidth = new URLSearchParams(location.search).has('world') ? 40 : 16, hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
  const dist = Math.max(halfWidth / Math.tan(hfov / 2), 14);
  const dir = new THREE.Vector3(0, 0.55, 0.83).normalize();
  const look = new URLSearchParams(location.search).get('look');   // ?look=x,y: frame the place at x east, y north (a meeting room), closer
  const [lx, ly] = look ? look.split(',').map(Number) : [null, null];
  if (look) controls.target.set(lx, 0.5, -ly); else if (new URLSearchParams(location.search).has('world')) controls.target.set(14, 0.5, 0); else controls.target.set(1, 0.5, 1);
  camera.position.copy(controls.target).addScaledVector(dir, look ? dist * 0.55 : dist); controls.update();
}
frame();
addEventListener('resize', () => { frame(); renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight); });

function label(text) {
  const d = document.createElement('div'); d.className = 'label'; d.textContent = text;
  return new CSS2DObject(d);
}


// ---------------------------------------------------------------- the world (?world): the Square, the buildings (glTF), their doors
// MMM/World/world.json says where everything is: the Square, the buildings with their walls and doors, the rooms, the seats, the acoustics of the meeting room. The buildings are
// 3D Locations, rendered by their glTF; a door is a Right - the client asks the M-Instance to move its Persona through it (MM-Move) and the M-Instance refuses (403) a User that
// has no Right to the Location behind it. What stops a walker is the walls; the door is shut until the M-Instance has let the Persona through.
const W = new URLSearchParams(location.search).has('world') ? await (await fetch('world/world.json', { cache: 'no-store' })).json() : null;
const solids = [], doors = [], origin = {}, buildingLabels = [], signBoards = [];
// What the model of a building does when it has loaded can run before the rest of this page has: the things it uses are defined here, at the top.
let plannedSeats = null;                      // the seats the meeting planned (the server's list): the room has their chairs and no more
fetch('/viewer/seats').then(r => r.ok ? r.json() : null).then(a => { if (Array.isArray(a) && a.length) plannedSeats = new Set(a); }).catch(() => { });
const seatChairs = new Map();                 // seat id -> { pivot, home: Vector3, yaw } - the chairs of the meeting room, one piece for each seat
let chairsNote = 'not called';
const blocked = (x, y) => {
  const R = 0.3;
  for (const r of solids) if (x > r[0] - R && x < r[2] + R && y > r[1] - R && y < r[3] + R) return true;
  for (const d of doors) if (!d.open) { const r = d.rect; if (x > r[0] - R && x < r[2] + R && y > r[1] - R && y < r[3] + R) return true; }
  return false;
};
if (W) {
  hemi.groundColor.set(0xc4c4c4);   // light from below too: the inside of a ceiling is not black
  ground.scale.setScalar(W.ground.size / 80); ground.material.color.set(0x4f7a4f);
  scene.background = new THREE.Color(0x9cc3e6);
  const sq = W.square; origin[sq.id] = [sq.x, sq.y];
  const pad = new THREE.Mesh(new THREE.BoxGeometry(sq.size, 0.04, sq.size), new THREE.MeshStandardMaterial({ color: 0x8a929c, roughness: 0.9 }));
  pad.position.set(sq.x, 0.02, -sq.y); pad.receiveShadow = true; scene.add(pad);
  const grid = new THREE.GridHelper(sq.size, sq.size / 2, 0x6b7380, 0x77808c); grid.position.set(sq.x, 0.045, -sq.y); scene.add(grid);
  const sl = label(sq.name); sl.position.set(sq.x, 0.5, -sq.y - sq.size / 2 + 1); scene.add(sl); buildingLabels.push(sl);
  const wl = new GLTFLoader();
  for (const b of W.buildings) {
    origin[b.id] = [b.x, b.y];
    for (const r of b.rooms) origin[r.id] = [b.x + r.x, b.y + r.y];
    for (const r of b.solids) solids.push(r);
    wl.load(b.model, g => { g.scene.position.set(b.x, 0, -b.y); scene.add(g.scene); try { splitChairs(g.scene, b); } catch (e) { chairsNote = 'error: ' + e.message; console.warn('chairs', e); } });
    for (const sg of [b.sign, ...(b.signs ?? [])].filter(Boolean)) {      // a sign: a board with its picture (the logo and the name) on the roof or on a wall, facing the way world.json says
      new THREE.TextureLoader().load(sg.image, tex => {
        tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
        const board = new THREE.Mesh(new THREE.PlaneGeometry(sg.width, sg.height), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
        board.position.set(sg.x, sg.z + sg.height / 2, -sg.y); board.rotation.y = sg.facing === 'west' ? -Math.PI / 2 : 0; board.userData.mmmSign = /mmm-sign/.test(sg.image); signBoards.push(board); scene.add(board);
      });
    }
    const l = label(b.name); l.position.set(b.x, b.height + 0.8, -b.y); scene.add(l); buildingLabels.push(l);
    for (const d of [...b.doors, ...b.rooms.map(r => r.door).filter(Boolean)]) {
      d.rect = d.axis === 'x' ? [d.x - 0.1, d.y - d.width / 2, d.x + 0.1, d.y + d.width / 2] : [d.x - d.width / 2, d.y - 0.1, d.x + d.width / 2, d.y + 0.1];
      const leaf = new THREE.Mesh(new THREE.BoxGeometry(d.axis === 'x' ? 0.08 : d.width, 2.2, d.axis === 'x' ? d.width : 0.08), new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.6 }));
      leaf.position.set(d.x, 1.1, -d.y); scene.add(leaf); d.leaf = leaf; d.open = false; doors.push(d);
      if (d.id !== 'MPAI-main') { const dl = label(d.name.replace(/ door$/, '')); dl.position.set(d.x, 2.6, -d.y); scene.add(dl); d.label = dl; }   // the name of the room, over its door
    }
  }
}

// ---------------------------------------------------------------- Locations
// An M-Location: a pad on the ground, its name and owner above it. A Location placed
// at another: a room - floor, glass walls - drawn only when perceptible.
const drawn = new Map();   // ID -> { object, kind, ... }
const loading = new Set();   // the IDs whose model is being loaded

function pad(t) {
  const g = new THREE.Group();
  const color = t.Public ? 0x4f6d8c : 0x5d8a5a;
  const m = new THREE.Mesh(new THREE.BoxGeometry(t.Size, 0.06, t.Size), new THREE.MeshStandardMaterial({ color, roughness: 0.9 }));
  m.position.y = 0.03; m.receiveShadow = true; g.add(m);
  const l = label(''); l.position.set(0, 0.1, t.Size / 2 + 0.4); g.add(l); g.userData.label = l;
  return g;
}

function room(t) {
  const g = new THREE.Group(); const s = t.Size, h = 2.6;
  const floor = new THREE.Mesh(new THREE.BoxGeometry(s, 0.08, s), new THREE.MeshStandardMaterial({ color: 0xb59a74, roughness: 0.7 }));
  floor.position.y = 0.1; floor.receiveShadow = true; g.add(floor);
  const glass = new THREE.MeshPhysicalMaterial({ color: 0xcfe6ff, transparent: true, opacity: 0.22, roughness: 0.1, side: THREE.DoubleSide, depthWrite: false });
  const frame = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.5 });
  for (const [x, z, w, d] of [[0, -s / 2, s, 0.05], [-s / 2, 0, 0.05, s], [s / 2, 0, 0.05, s], [-s / 4 - 0.3, s / 2, s / 2 - 0.6, 0.05], [s / 4 + 0.3, s / 2, s / 2 - 0.6, 0.05]]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glass); wall.position.set(x, h / 2 + 0.1, z); g.add(wall);
    const top = new THREE.Mesh(new THREE.BoxGeometry(w || 0.05, 0.08, d || 0.05), frame); top.position.set(x, h + 0.1, z); g.add(top);
  }
  const l = label(''); l.position.set(0, h + 0.5, 0); g.add(l); g.userData.label = l;
  return g;
}

// ---------------------------------------------------------------- Personae
// Their 3D Models (Rocketbox, MMM/Viewer/personae): the opacity material made
// transparent; measured as their skeleton poses them; arms brought down from the
// T-pose they come in.
const loader = new GLTFLoader(); const models = new Map();

// THE ARMS. The models come in a T-pose. Standing, the arms hang straight down, along the body; seated, the hands rest on the table. The way a bone turns depends on how the model was
// made, so nothing is assumed: an arm is turned about an axis of the Persona (a swing, in the frame of the bone's parent) and the angle that gives the wanted place is looked for.
const boneOf = (root, re) => { let b = null; root.traverse(o => { if (o.isBone && re.test(o.name)) b = o; }); return b; };
const armBones = root => ({ lu: boneOf(root, /L.?UpperArm$/i), lf: boneOf(root, /L.?Forearm$/i), lh: boneOf(root, /L.?Hand$/i), ru: boneOf(root, /R.?UpperArm$/i), rf: boneOf(root, /R.?Forearm$/i), rh: boneOf(root, /R.?Hand$/i),
  lt: boneOf(root, /L.?Finger0$/i), lm: boneOf(root, /L.?Finger2$/i), lp: boneOf(root, /L.?Finger4$/i), rt: boneOf(root, /R.?Finger0$/i), rm: boneOf(root, /R.?Finger2$/i), rp: boneOf(root, /R.?Finger4$/i) });
const placeOf = (frame, bone) => frame.worldToLocal(bone.getWorldPosition(new THREE.Vector3()));      // where a bone is, in the Persona's own frame (x its left, y up, z the way it looks)
const axisOf = (frame, x, y, z) => new THREE.Vector3(x, y, z).transformDirection(frame.matrixWorld);   // an axis of the Persona, in the world
function swing(bone, worldAxis, degrees) {                                                          // turn a bone about a world axis (three.js does not allow for a turned parent)
  const parent = new THREE.Quaternion(); bone.parent.getWorldQuaternion(parent);
  bone.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(worldAxis.clone().applyQuaternion(parent.invert()), THREE.MathUtils.degToRad(degrees)));
}
function armsDown(frame) {
  frame.updateMatrixWorld(true);
  const A = armBones(frame);
  for (const [u, f] of [[A.lu, A.lf], [A.ru, A.rf]]) {
    if (!u || !f) continue;
    const rest = u.userData.armRest ??= u.quaternion.clone();                                        // as the model came
    u.quaternion.copy(rest); u.updateMatrixWorld(true);
    const out = Math.sign(placeOf(frame, f).x - placeOf(frame, u).x) || 1, z = axisOf(frame, 0, 0, 1);   // out: the way the arm points in the T-pose
    let best = { cost: 1e9, a: 0 };
    for (let a = -150; a <= 150; a += 3) {
      u.quaternion.copy(rest); swing(u, z, a); u.updateMatrixWorld(true);
      const s = placeOf(frame, u), e = placeOf(frame, f), len = e.distanceTo(s) || 1;
      const cost = Math.abs((e.x - s.x) * out / len - 0.04) + ((s.y - e.y) / len < 0.8 ? 5 : 0);       // straight down, a hair away from the body
      if (cost < best.cost) best = { cost, a };
    }
    u.quaternion.copy(rest); swing(u, z, best.a); u.userData.armDown = u.quaternion.clone();
  }
  frame.updateMatrixWorld(true);
}
// The vertices of the skin that follow a hand (a hand bone or a finger bone has most of their weight): what touches the table is the skin, not the bones.
function handVertices(frame, side, parts = 'Hand|Finger') {
  const list = [], re = new RegExp(side + '.?(' + parts + ')', 'i');
  frame.traverse(o => {
    if (!o.isSkinnedMesh || !o.geometry.attributes.skinIndex) return;
    const mine = new Set(); o.skeleton.bones.forEach((b, i) => { if (re.test(b.name)) mine.add(i); });
    const si = o.geometry.attributes.skinIndex, sw = o.geometry.attributes.skinWeight, keep = [];
    for (let i = 0; i < si.count; i++) { let w = 0; for (let k = 0; k < 4; k++) if (mine.has(si.getComponent(i, k))) w += sw.getComponent(i, k); if (w > 0.6) keep.push(i); }
    if (keep.length) list.push({ mesh: o, keep });
  });
  return list;
}
function skinHeights(frame, list) {                                                                  // the heights of those vertices, in the Persona's frame, as the bones pose them now
  const v = new THREE.Vector3(), ys = [];
  for (const { mesh, keep } of list) { mesh.skeleton.update(); for (const i of keep) { mesh.getVertexPosition(i, v); v.applyMatrix4(mesh.matrixWorld); ys.push(frame.worldToLocal(v).y); } }
  return ys;
}
// Seated: the upper arm forward and the forearm bent so that the hand rests on the table - reach metres in front of the body, the table top at top metres above the floor of the
// Persona's frame. The wrist is put where it should be, the forearm twisted so that the palm is down, the hand bent so that the fingers lie along the table; then the lowest point of the
// hand is looked at, and the wrist raised or lowered by what is missing, until the hand lies on the table, not above it or in it (models differ in the length of arms and size of hands).
function armsOnTable(frame, reach, top) {
  frame.updateMatrixWorld(true);
  const A = armBones(frame), x = axisOf(frame, 1, 0, 0);
  const wp = bone => bone.getWorldPosition(new THREE.Vector3());
  for (const [u, f, h, thumb, middle, pinky, side] of [[A.lu, A.lf, A.lh, A.lt, A.lm, A.lp, 'L'], [A.ru, A.rf, A.rh, A.rt, A.rm, A.rp, 'R']]) {
    if (!u || !f || !h || !u.userData.armDown) continue;
    const forearm = f.userData.armRest ??= f.quaternion.clone(), flat = h.userData.handRest ??= h.quaternion.clone(), skin = handVertices(frame, side), contact = handVertices(frame, side, 'Hand|Finger|Forearm'), arm = handVertices(frame, side, 'Forearm');
    u.quaternion.copy(u.userData.armDown); f.quaternion.copy(forearm); h.quaternion.copy(flat); u.updateMatrixWorld(true);
    const s = placeOf(frame, u), inside = Math.sign(s.x) || 1;
    const pose = height => {
      let best = { cost: 1e9, a: 0, b: 0 };
      const spot = (a, b, fine) => { u.quaternion.copy(u.userData.armDown); swing(u, x, a); f.quaternion.copy(forearm); swing(f, x, b); h.quaternion.copy(flat); u.updateMatrixWorld(true); const p = placeOf(frame, h), e = placeOf(frame, f); return Math.hypot(p.z - reach, p.y - height, (p.x - s.x) * 0.5, 6 * (e.y - (top + 0.025 - ELBOW_DROP)), fine ? 4 * (Math.min(...skinHeights(frame, arm)) - (top - HAND_SINK)) : 0); };   // the elbow at the table and the wrist near it, and in the end the underside of the forearm on it: the forearm lies along the table
      for (let a = -120; a <= 60; a += 6) for (let b = -140; b <= 20; b += 6) { const cost = spot(a, b); if (cost < best.cost) best = { cost, a, b }; }
      best.cost = spot(best.a, best.b, true);
      for (let a = best.a - 6; a <= best.a + 6; a++) for (let b = best.b - 6; b <= best.b + 6; b++) { const cost = spot(a, b, true); if (cost < best.cost) best = { cost, a, b }; }   // a finer look round the best
      spot(best.a, best.b);
      if (!thumb || !middle || !pinky) return;
      const axis = wp(h).sub(wp(f)).normalize(), turned = f.quaternion.clone(); let tw = { cost: 1e9, t: 0 };                      // the palm down: the line from the little finger to the thumb level, the thumb on the inside
      for (let t = -180; t < 180; t += 10) {
        f.quaternion.copy(turned); swing(f, axis, t); u.updateMatrixWorld(true);
        const th = placeOf(frame, thumb), pk = placeOf(frame, pinky), cost = Math.abs(th.y - pk.y) * 3 + ((th.x - pk.x) * inside > 0 ? 1 : 0);
        if (cost < tw.cost) tw = { cost, t };
      }
      f.quaternion.copy(turned); swing(f, axis, tw.t); u.updateMatrixWorld(true);
      const hq = h.quaternion.clone(); let hb = { cost: 1e9, a: 0 };                                                              // the hand flat: its lowest and its average height as near as may be
      for (let a = -90; a <= 90; a += 5) {
        h.quaternion.copy(hq); swing(h, x, a); u.updateMatrixWorld(true);
        const m = placeOf(frame, middle), p0 = placeOf(frame, h), ys = skinHeights(frame, skin), low = Math.min(...ys), cost = Math.abs(low - Math.min(...skinHeights(frame, arm))) + 0.5 * (ys.reduce((q, y) => q + y, 0) / ys.length - low) + (m.z - p0.z < 0.02 ? 1 : 0);   // the hand as low as the forearm, and flat
        if (cost < hb.cost) hb = { cost, a };
      }
      h.quaternion.copy(hq); swing(h, x, hb.a); u.updateMatrixWorld(true);
    };
    let height = top + 0.03;
    for (let round = 0; round < 4; round++) {
      pose(height);
      const gap = Math.min(...skinHeights(frame, contact)) - (top - HAND_SINK);                                    // how far the lowest point of the forearm and hand is above the table (below it, if negative)
      if (Math.abs(gap) < 0.003) break;
      height -= gap;
    }

{ let down = null;

function driveGhost(dt) {   // the camera of a User out of its body

  const turn = (k.has('a') || k.has('arrowleft') ? 1 : 0) - (k.has('d') || k.has('arrowright') ? 1 : 0);
  const up = (k.has('r') ? 1 : 0) - (k.has('f') ? 1 : 0), look = (k.has('q') ? 1 : 0) - (k.has('e') ? 1 : 0);

function drive(dt) {   // the keys: W/S or up/down walk, A/D or left/right turn; the camera is the Persona's eyes

}

// ---------------------------------------------------------------- the M-Instance

    if (l) l.element.textContent = t.Kind === 'Persona' ? `${client?.hands?.has(t.Owner) ? '\u270B ' : ''}${W ? (t.Owner ?? t.ID) : t.ID}${t.Animation ? ' (animated)' : ''}` : `${t.ID}${t.Owner ? ' - ' + t.Owner : ''}${t.Public ? ' (open)' : ''}`;

// WHILE A SCREEN IS SHOWN, AND ONLY WHILE YOU LOOK AT IT, the room is drawn for you without what stands between you and the screen: the three seats of the north side (between the table and the
// north wall), with their chairs - the chairs of the room are one piece of the model of the building, cut into one piece for each seat of the meeting room - and the Personae that sit in them are
// drawn aside, at the two ends of the wall. It is only a drawing, for the one who looks: nobody moves in the M-Instance, nobody else's view is changed, and when you turn away from the screen you

let seatTable = null;

    dbgAt = Date.now();
    if (!dbgEl) { dbgEl = document.createElement('div'); Object.assign(dbgEl.style, { position: 'fixed', left: '8px', bottom: '34px', zIndex: 30, background: 'rgba(0,0,0,.7)', color: '#ff0', font: '12px monospace', padding: '2px 6px' }); document.body.appendChild(dbgEl); }

// Personae walk to where they now are, at about 2 m/s, facing the way they go.
const clock = new THREE.Clock();

  applyMouths(dt);
  moveSeats(dt);
  for (const [id, b] of boards) {                                                                      // each board follows the Persona that sits at it, and is shown when it is
    const d = drawn.get(id), here = !!d?.object.userData.sitting;
    b.group.visible = here && (b.own ? false : d.object.visible && !!d.object.userData.label?.visible);      // the own board is the bar at the foot of the page, not a box on the table
    if (here) { b.group.position.set(d.object.position.x, d.object.position.y + BOARD_TOP, d.object.position.z); b.group.rotation.y = d.object.rotation.y; }
  }
  for (const d of drawn.values()) {
    // the height of a seated Persona is the one the refresh gave (lowered onto its chair): only where it is on the floor changes here
    if (d.seat && d.real) { const c = lookingAtScreen ? compactSeat(d.seat.q, lookWall) : null; d.target.set(c ? d.seat.cx + c.x : d.real.x, d.target.y, c ? -(d.seat.cy + c.y) : d.real.z); d.yaw = c ? c.yaw : d.real.yaw; }
    const p = d.object.position, to = d.target, dist = p.distanceTo(to);
    if (dist > 0.01) {

  if (W && client) for (const d of doors) if (d.open && Math.hypot(client.x - d.x, client.y - d.y) > 2) { d.open = false; d.leaf.visible = true; }      // the door closes behind whoever went through it
