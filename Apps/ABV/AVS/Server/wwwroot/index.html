<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar-Based Videoconference</title>
<!--
  ABV live demo client (protocol: D:\DI\ABV\PROTOCOL.md). Room: x east, y north, z up (metres);
  three.js: x = x, y = z, z = -y. Own seat = first-person camera; the others are drawn at their seats.
  URL parameters: ?bot=NAME&avatar=ID (no microphone, synthetic speech)  ?autojoin=NAME&avatar=ID (microphone)
-->
<style>
  :root { --bg:#14181e; --panel:#1d232b; --line:#323b46; --text:#e6e8eb; --muted:#97a1ac; --acc:#4da3ff; --ok:#6fcf97; --no:#eb5757; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, Arial, sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; background:#2a3340; border:1px solid var(--line); border-radius:6px; padding:6px 14px; cursor:pointer; }
  button:hover { background:#344050; }
  input { font:inherit; color:inherit; background:#10141a; border:1px solid var(--line); border-radius:6px; padding:7px 10px; }
  #join { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:16px; overflow:auto; }
  #join h1 { margin:0; font-size:24px; font-weight:600; }
  #tiles { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .tile { width:170px; background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:8px; cursor:pointer; text-align:center; }
  .tile.sel { border-color:var(--acc); background:#22303f; }
  .tile img, .tile .ph { width:150px; height:190px; display:block; margin:0 auto 6px; border-radius:6px; background:#10141a; object-fit:cover; }
  #row { display:flex; gap:10px; align-items:center; }
  #err { color:var(--no); min-height:1.4em; }
  #app { position:absolute; inset:0; display:none; }
  #view { position:absolute; left:0; top:0; bottom:0; right:clamp(220px,28vw,340px); overflow:hidden; }
  #view canvas { display:block; }
  #side { position:absolute; right:0; top:0; bottom:0; width:clamp(220px,28vw,340px); background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; padding:10px; gap:8px; min-height:0; }
  #side h2 { margin:0; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  #roster { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#10141a; border:1px solid var(--line); border-radius:12px; padding:1px 10px; }
  .chip.sp { border-color:var(--ok); color:var(--ok); }
  .chip.me { font-weight:600; }
  #minutes { flex:1 1 40%; min-height:60px; overflow:auto; margin:0; white-space:pre-wrap; background:#10141a; border:1px solid var(--line); border-radius:6px; padding:8px; font:12.5px/1.45 system-ui, Arial, sans-serif; }
  #chatlog { flex:1 1 30%; min-height:60px; overflow:auto; background:#10141a; border:1px solid var(--line); border-radius:6px; padding:8px; font-size:13px; }
  #chatlog b { color:var(--acc); }
  #chatrow { display:flex; gap:6px; } #chatrow input { flex:1; min-width:0; }
  #bar { display:flex; gap:8px; align-items:center; }
  #meter { flex:1; height:8px; background:#10141a; border-radius:4px; overflow:hidden; border:1px solid var(--line); }
  #meter div { height:100%; width:0; background:var(--ok); }
  #status { position:absolute; left:12px; bottom:10px; color:var(--muted); font-size:12px; background:rgba(0,0,0,.45); padding:2px 8px; border-radius:4px; pointer-events:none; }
  .label { color:#fff; font:13px system-ui, Arial; background:rgba(0,0,0,.6); padding:2px 8px; border-radius:5px; white-space:nowrap; border:1px solid transparent; }
  .label.sp { border-color:var(--ok); }
  .label.sp::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; }
  @media (max-width:520px) { #view { right:0; bottom:46% } #side { top:54%; width:auto; left:0; border-left:0; border-top:1px solid var(--line); } }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }
</script>
</head>
<body>
<div id="join">
  <h1>Avatar-Based Videoconference</h1>
  <div id="tiles"></div>
  <div id="row"><input id="name" placeholder="your name" maxlength="24" autocomplete="off"><select id="lang" title="the language you speak"><option value="it">Italiano</option><option value="en" selected>English</option><option value="fr">Français</option><option value="pt">Português</option><option value="es">Español</option><option value="de">Deutsch</option><option value="auto">Auto</option></select><input id="code" placeholder="meeting code" maxlength="12" autocomplete="off" style="display:none;width:9em"><button id="joinBtn">Join</button></div>
  <div id="err"></div>
</div>
<div id="app">
  <div id="view"><div id="status"></div></div>
  <div id="side">
    <h2>Participants</h2><div id="roster"></div>
    <h2>Minutes</h2><pre id="minutes"></pre>
    <h2>Chat</h2><div id="chatlog"></div>
    <div id="chatrow"><input id="chatIn" placeholder="say something" autocomplete="off"><button id="chatBtn">Send</button></div>
    <div id="bar"><button id="muteBtn">Mute</button><button id="leaveBtn" style="margin-left:8px">Leave</button><div id="meter"><div></div></div></div>
  </div>
</div>
<script type="module" src="app.js?v=17"></script>
</body>
</html>
